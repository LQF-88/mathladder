name: Signed Android release

# Manual, because it needs a keystore in repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of your .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# See docs/RELEASE.md for the full Play Store checklist.

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Output format"
        type: choice
        options: [aab, apk]
        default: aab

permissions:
  contents: read

jobs:
  release:
    name: Build signed ${{ inputs.artifact }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            .buildozer
          key: buildozer-release-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-release-v2-${{ runner.os }}-

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret ANDROID_$name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Buildozer
        run: python -m pip install --upgrade pip "buildozer==1.6.0" "cython==0.29.36"

      - name: Decode keystore and configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          python - <<'PY'
          import os
          import re

          path = "buildozer.spec"
          spec = open(path, encoding="utf-8").read()
          values = {
              "android.keystore": os.path.abspath("release.keystore"),
              "android.keystore_passwd": os.environ["KEYSTORE_PASSWORD"],
              "android.keyalias": os.environ["KEY_ALIAS"],
              "android.keyalias_passwd": os.environ["KEY_PASSWORD"],
              "android.release_artifact": os.environ["ARTIFACT"],
          }
          for key, value in values.items():
              spec = re.sub(
                  rf"^{re.escape(key)}\s*=.*$",
                  lambda _match, k=key, v=value: f"{k} = {v}",
                  spec,
                  flags=re.MULTILINE,
              )
          open(path, "w", encoding="utf-8").write(spec)
          PY

      - name: Build signed artifact
        run: buildozer -v android release

      - name: Verify 16 KB page-size support
        run: python tools/check_apk_alignment.py bin/*.${{ inputs.artifact }}

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathladder-signed-${{ inputs.artifact }}
          path: bin/*.${{ inputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore buildozer.spec.orig
